{% extends "base.html" %}

{% block title %}
    Crear cuenta | PC Hardware Store
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-6 col-lg-5">

        <div class="card">

            <div class="card-body p-4">

                <h1 class="text-center mb-4">
                    Crear cuenta
                </h1>

                {% if error %}

                    <div class="alert alert-danger">
                        {{ error }}
                    </div>

                {% endif %}

                <form method="post">

                    {% csrf_token %}

                    <div class="mb-3">

                        <label
                            for="username"
                            class="form-label"
                        >
                            Usuario
                        </label>

                        <input
                            type="text"
                            name="username"
                            id="username"
                            class="form-control"
                            required
                        >

                    </div>

                    <div class="mb-3">

                        <label
                            for="email"
                            class="form-label"
                        >
                            Correo electrónico
                        </label>

                        <input
                            type="email"
                            name="email"
                            id="email"
                            class="form-control"
                            required
                        >

                    </div>

                    <div class="mb-3">

                        <label
                            for="password"
                            class="form-label"
                        >
                            Contraseña
                        </label>

                        <input
                            type="password"
                            name="password"
                            id="password"
                            class="form-control"
                            required
                        >

                    </div>

                    <div class="mb-3">

                        <label
                            for="password_confirmacion"
                            class="form-label"
                        >
                            Confirmar contraseña
                        </label>

                        <input
                            type="password"
                            name="password_confirmacion"
                            id="password_confirmacion"
                            class="form-control"
                            required
                        >

                    </div>

                    <button
                        type="submit"
                        class="btn btn-primary w-100"
                    >
                        Registrarse
                    </button>

                </form>

                <div class="text-center mt-3">

                    <a href="{% url 'login-html' %}">
                        Ya tengo una cuenta
                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
